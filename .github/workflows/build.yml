name: Compile AutoTotem

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Compile mod
        run: |
          cd source/AutoTotem-Fabric-26.2
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoTotem-Fabric-26.2-JAR
          path: source/AutoTotem-Fabric-26.2/build/libs/*.jar
          if-no-files-found: error
